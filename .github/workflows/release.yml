name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Universal TabSwitch.app & DMG
        run: |
          set -euo pipefail
          DIST="dist"
          APP="$DIST/TabSwitch.app"
          ICONSET="$DIST/AppIcon.iconset"
          STAGE="$DIST/.dmg_stage"
          DMG="$DIST/TabSwitch.dmg"

          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$ICONSET"
          cp Resources/Info.plist "$APP/Contents/Info.plist"

          # Update version from git tag if triggered by tag
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"
          fi

          # Generate AppIcon.icns
          swift -e '
          import Cocoa
          let outDir = CommandLine.arguments[1]
          let sizes: [(String, Int)] = [
              ("icon_16x16.png", 16), ("icon_16x16@2x.png", 32),
              ("icon_32x32.png", 32), ("icon_32x32@2x.png", 64),
              ("icon_128x128.png", 128), ("icon_128x128@2x.png", 256),
              ("icon_256x256.png", 256), ("icon_256x256@2x.png", 512),
              ("icon_512x512.png", 512), ("icon_512x512@2x.png", 1024)
          ]
          for (name, px) in sizes {
              let rep = NSBitmapImageRep(bitmapDataPlanes: nil, pixelsWide: px, pixelsHigh: px, bitsPerSample: 8, samplesPerPixel: 4, hasAlpha: true, isPlanar: false, colorSpaceName: .deviceRGB, bytesPerRow: 0, bitsPerPixel: 0)!
              NSGraphicsContext.saveGraphicsState()
              NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
              let s = CGFloat(px)
              let inset = s * 0.08
              let rect = NSRect(x: inset, y: inset, width: s - inset * 2, height: s - inset * 2)
              let path = NSBezierPath(roundedRect: rect, xRadius: s * 0.21, yRadius: s * 0.21)
              let grad = NSGradient(colors: [
                  NSColor(calibratedRed: 0.16, green: 0.34, blue: 0.88, alpha: 1.0),
                  NSColor(calibratedRed: 0.08, green: 0.14, blue: 0.36, alpha: 1.0)
              ])!
              grad.draw(in: path, angle: -90)
              NSColor(white: 1.0, alpha: 0.22).setStroke()
              path.lineWidth = max(1, s * 0.015)
              path.stroke()
              if let sym = NSImage(systemSymbolName: "macwindow.on.rectangle", accessibilityDescription: nil) {
                  let cfg = NSImage.SymbolConfiguration(pointSize: s * 0.44, weight: .semibold)
                      .applying(.init(paletteColors: [.white]))
                  let img = sym.withSymbolConfiguration(cfg) ?? sym
                  let imgSize = img.size
                  let drawRect = NSRect(x: (s - imgSize.width) / 2, y: (s - imgSize.height) / 2, width: imgSize.width, height: imgSize.height)
                  img.draw(in: drawRect)
              }
              NSGraphicsContext.restoreGraphicsState()
              let data = rep.representation(using: .png, properties: [:])!
              try! data.write(to: URL(fileURLWithPath: outDir + "/" + name))
          }
          ' "$ICONSET"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          rm -rf "$ICONSET"

          # Compile Universal Binary (Apple Silicon + Intel)
          swiftc -O -target arm64-apple-macos13.0 Sources/main.swift -o "$DIST/TabSwitch-arm64"
          swiftc -O -target x86_64-apple-macos13.0 Sources/main.swift -o "$DIST/TabSwitch-x86_64"
          lipo -create -output "$APP/Contents/MacOS/TabSwitch" "$DIST/TabSwitch-arm64" "$DIST/TabSwitch-x86_64"
          rm -f "$DIST/TabSwitch-arm64" "$DIST/TabSwitch-x86_64"

          # Ad-hoc sign & verify
          codesign --force --deep --sign - --identifier com.z.tabswitch "$APP"
          codesign --verify --verbose=2 "$APP"

          # Package DMG
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "TabSwitch" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          rm -rf "$STAGE"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TabSwitch-macOS-Universal
          path: dist/TabSwitch.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TabSwitch.dmg
          generate_release_notes: true
